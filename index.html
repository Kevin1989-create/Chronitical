<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chronitical</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#C89B3C">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chronitical">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.workers.dev; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF5E9;
    --paper:#FFFDF8;
    --ink:#2E2A22;
    --ink-soft:#948C79;
    --ink-faint:#C7BEA9;
    --line:#E9E0CC;

    --c-today:#C89B3C;
    --c-todo:#3F6B63;
    --c-events:#3E6B9E;
    --c-cal:#B4506A;
    --c-watch:#7C5C87;
    --c-books:#5E7C4F;
    --c-culture:#7C5C87;
    --c-places:#C9773D;
    --c-upcoming:#5FA8D3;
    --c-groceries:#4E8B5C;
    --c-assistant:#6E6ACF;
    --c-ideas:#B98A3E;
    --c-notes:#4A5C8C;
    --c-dates:#A24A3A;
    --c-chat:#8A6242;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);height:100%;font-family:'Inter',sans-serif;}
  body{min-height:100vh; padding-bottom:24px;}
  .num{font-family:'JetBrains Mono',monospace;}
  .ring-label .num{font-family:'Inter',sans-serif;} /* JetBrains Mono draws '0' with a dot inside it by design — avoid that here */
  h1,h2,h3{font-family:'Fraunces',serif; margin:0;}

  header.top{
    padding:26px 20px 14px;
    position:sticky; top:0; z-index:6;
    background:var(--cream);
  }
  .brand-row{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:2px;}
  .brand{font-family:'Fraunces',serif; font-weight:700; font-size:20px; letter-spacing:-.01em;}
  .date{color:var(--ink-soft); font-size:12px; letter-spacing:.06em; text-transform:uppercase;}
  header.top h1{font-size:27px; font-weight:600; margin-top:6px; letter-spacing:-.01em;}

  .tabstrip{
    display:flex; flex-wrap:wrap; gap:6px; padding:12px 20px 6px;
    position:sticky; top:78px; z-index:5; background:var(--cream);
  }
  .tabchip{
    flex:0 0 auto; display:flex; align-items:center; gap:6px;
    background:var(--paper); border:1px solid var(--line); border-radius:999px;
    padding:8px 16px 8px 12px; font-size:12.5px; font-weight:600; color:var(--ink-soft);
    white-space:nowrap;
  }
  .tabchip .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
  .tabchip.active{color:var(--ink); border-color:transparent; box-shadow:0 1px 3px rgba(46,42,34,0.08), 0 0 0 1.5px var(--chip-color) inset;}
  .tabchip-main{border:2px solid var(--chip-color); font-weight:800;}
  .tabchip-main.active{box-shadow:0 1px 3px rgba(46,42,34,0.08), 0 0 0 2.5px var(--chip-color) inset;}
  .tabstrip.reorder-mode .tabchip:not(.tabchip-main){touch-action:none; cursor:grab;}
  .tabstrip.reorder-mode .tabchip.dragging{opacity:.4;}
  #tabReorderToggle.active{color:var(--ink); font-weight:700;}

  main{padding:6px 16px 40px; max-width:520px; margin:0 auto;}
  section{display:none; animation:fade .25s ease;}
  section.active{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:translateY(0)}}

  .card{
    position:relative;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:18px;
    padding:14px 16px 14px 20px;
    margin-bottom:11px;
    box-shadow:0 1px 2px rgba(46,42,34,0.04);
  }
  .card::before{
    content:''; position:absolute; left:0; top:16px; bottom:16px; width:4px;
    border-radius:3px; background:var(--spine, var(--c-today));
  }
  .card h2{font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600; margin-bottom:10px; font-family:'Inter',sans-serif;}

  .empty{color:var(--ink-faint); font-size:12.5px; padding:8px 0; font-style:italic;}

  .row{display:flex; align-items:center; gap:8px; padding:4px 0; border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .badge{width:24px; height:24px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:700; flex-shrink:0; color:#fff;}
  .row-info{flex:1; min-width:0;}
  .row-info b{display:block; font-size:12.5px; font-weight:600; line-height:1.2;}
  .row-info span{font-size:10.5px; color:var(--ink-soft);}
  .hb-row{cursor:pointer;}
  .hb-detail{display:none;}
  .hb-row.expanded .hb-detail{display:block;}
  button.hb-detail{display:none;}
  .hb-row.expanded button.hb-detail{display:inline-flex; align-items:center;}

  input[type=text], input[type=number], input[type=date], input[type=time], select, textarea{
    background:var(--cream); border:1px solid var(--line); color:var(--ink);
    border-radius:11px; padding:11px 13px; font-size:15px; font-family:inherit; width:100%;
  }
  input::placeholder, textarea::placeholder{color:var(--ink-faint);}
  textarea{resize:vertical; min-height:70px; font-family:'Inter',sans-serif;}
  button{font-family:inherit; cursor:pointer; border:none;}
  .add-row{display:flex; gap:8px; margin-bottom:12px;}
  .btn{
    background:var(--btn-color, var(--c-today)); color:#fff; font-weight:600; padding:0 18px;
    border-radius:11px; font-size:14.5px; flex-shrink:0;
  }
  .btn-full{width:100%; padding:12px;}
  .btn-ghost{background:none; color:var(--ink-soft); font-size:16px; padding:4px 6px;}

  .item{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:none;}
  .check{width:19px; height:19px; border-radius:6px; border:1.5px solid var(--ink-faint); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; background:none;}
  .item.done .check{background:var(--check-color, var(--c-todo)); border-color:var(--check-color, var(--c-todo));}
  .item.done .text{text-decoration:line-through; color:var(--ink-faint);}
  .item .text{flex:1; font-size:13.5px;}

  .pill-tabs{display:flex; gap:6px; margin-bottom:14px;}
  .pill-tabs button{flex:1; background:var(--cream); border:1px solid var(--line); color:var(--ink-soft); padding:8px; border-radius:10px; font-size:13px; font-weight:600;}
  .pill-tabs button.active{background:var(--pill-color, var(--c-today)); color:#fff; border-color:transparent;}

  .chip{border:1.5px solid var(--ink-faint); background:var(--paper); color:var(--ink-soft); border-radius:999px; padding:0 14px; height:38px; font-size:13px; font-weight:600; white-space:nowrap;}
  .chip.active{background:var(--chip-color, var(--c-todo)); border-color:var(--chip-color, var(--c-todo)); color:#fff;}
  .tag-asap{background:var(--c-todo); color:#fff; font-size:10px; font-weight:700; letter-spacing:.03em; padding:2px 6px; border-radius:5px; margin-left:6px; vertical-align:middle;}
  .drag-handle{cursor:grab; color:var(--ink-faint); padding:8px 10px; touch-action:none; font-size:22px; line-height:1; user-select:none; flex-shrink:0; margin:-8px -2px; display:flex; align-items:center; justify-content:center;}
  .item.dragging{opacity:.35;}

  .goal-row{display:flex; gap:8px; align-items:center; margin-top:12px;}
  .goal-row label{font-size:12px; color:var(--ink-soft); white-space:nowrap;}

  .log-item{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .log-item:last-child{border-bottom:none;}
  .log-item .amt{font-family:'JetBrains Mono',monospace; color:var(--c-cal); font-weight:600;}
  .log-item .meta{color:var(--ink-soft); font-size:12px;}

  .cal-history-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
  .cal-weekday-row{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:5px;}
  .cal-weekday-row span{text-align:center; font-size:10px; font-weight:600; color:var(--ink-soft); text-transform:uppercase;}
  .hist-cell{aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:7px; border-radius:9px; background:var(--cream); font-size:11px; cursor:pointer;}
  .hist-top-row{display:grid; grid-template-columns:13px 1fr 13px; align-items:center; width:100%; height:14px;}
  .hist-icon-left{font-size:9px; text-align:left; line-height:14px;}
  .hist-icon-right{font-size:9px; text-align:right; line-height:14px;}
  .hist-day{font-weight:600; color:var(--ink); text-align:center; line-height:14px;}
  .hist-kcal{font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--c-cal); height:12px; line-height:12px;}
  .hist-weight{font-size:8.5px; color:var(--ink-soft); line-height:11px; height:11px;}
  .hist-cell.empty-cell{background:transparent;}
  .hist-cell.hist-has{background:rgba(180,80,106,0.12);}
  .hist-cell.hist-today{border:1.5px solid var(--c-cal);}
  .hist-cell.hist-selected{outline:2px solid var(--c-events); outline-offset:-2px;}

  .plate-row{display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--line); color:var(--ink-soft);}
  .plate-row:last-child{border-bottom:none;}
  .plate-row .text{flex:1; font-size:13px;}
  .plate-row .meta{color:var(--ink-soft); font-size:11px; display:block; opacity:.8;}
  .plate-row .btn-ghost{font-size:12px; padding:4px 8px;}
  .plate-add{width:24px; height:24px; border-radius:50%; background:var(--c-cal); color:#fff; font-size:14px; font-weight:700; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .plate-row-edit{gap:6px; flex-wrap:wrap;}
  .plate-row-edit input, .plate-row-edit select{flex:1; min-width:80px; font-size:13px; padding:6px 8px;}

  .note-card{background:var(--cream); border:1px solid var(--line); border-radius:12px; padding:13px; margin-bottom:10px;}
  .note-card .note-title{font-weight:600; font-size:14.5px; margin-bottom:4px;}
  .note-card .note-body{font-size:13.5px; color:var(--ink-soft); white-space:pre-wrap; line-height:1.45;}
  .note-actions{display:flex; justify-content:flex-end; margin-top:6px;}

  .status-pill{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em; flex-shrink:0;}
  .status-pill.todo{background:#EFE9D8; color:var(--ink-soft);}
  .status-pill.done{color:#fff;}

  /* mic button */
  .mic-btn{
    width:52px; height:52px; border-radius:16px; flex-shrink:0;
    background:var(--cream); border:1px solid var(--line); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .mic-btn.listening{ background:var(--mic-color, var(--c-cal)); color:#fff; border-color:transparent; animation:pulse 1.1s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(180,80,106,0.4);} 70%{box-shadow:0 0 0 10px rgba(180,80,106,0);} 100%{box-shadow:0 0 0 0 rgba(180,80,106,0);} }
  .voice-status{font-size:12.5px; color:var(--ink-soft); margin-top:8px; min-height:16px;}

  /* chat */
  .chat-log{display:flex; flex-direction:column; gap:10px; margin-bottom:4px; padding:2px;}
  .chat-msg{max-width:82%; padding:11px 15px; border-radius:16px; font-size:14.5px; line-height:1.45; box-shadow:0 1px 2px rgba(46,42,34,0.06);}
  .chat-msg.user{align-self:flex-end; background:var(--c-assistant); color:#fff; border-bottom-right-radius:4px;}
  .chat-msg.assistant{align-self:flex-start; background:var(--cream); border:1px solid var(--line); border-bottom-left-radius:4px;}
  .chat-input-row{display:flex; flex-direction:column; gap:10px; margin-top:12px;}
  .chat-input-row input{width:100%;}
  .chat-input-actions{display:flex; gap:10px;}
  .chat-send-btn{
    flex:1; height:52px; border-radius:16px; background:var(--c-assistant); color:#fff;
    font-size:15.5px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px;
    border:none; box-shadow:0 4px 14px rgba(110,106,207,0.35);
  }
  .chat-note{font-size:12px; color:var(--ink-faint); margin-bottom:10px; line-height:1.5;}

  .assistant-fab{
    position:fixed; top:16px; right:16px; z-index:200;
    width:46px; height:46px; border-radius:50%;
    background:var(--c-assistant); color:#fff; font-size:22px; font-weight:600;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.25); border:none;
  }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(46,42,34,.45); z-index:300;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-card{
    background:var(--paper); width:100%; max-width:480px; border-radius:20px 20px 0 0;
    padding:20px; max-height:85vh; overflow-y:auto;
  }
  .modal-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .modal-close{background:none; border:none; font-size:24px; line-height:1; color:var(--ink-soft); padding:4px 8px;}
</style>
</head>
<body>

<button class="assistant-fab" id="assistantFab" onclick="openAssistantModal()" aria-label="Assistant">＋</button>

<div class="modal-overlay" id="assistantModal" style="display:none;" onclick="if(event.target===this) closeAssistantModal()">
  <div class="modal-card">
    <div class="modal-header">
      <h2 style="margin:0; display:flex; align-items:center; gap:8px;"><span style="width:9px; height:9px; border-radius:50%; background:var(--c-assistant); display:inline-block;"></span>Assistant</h2>
      <button class="modal-close" onclick="closeAssistantModal()">×</button>
    </div>
    <div class="chat-note">A general chat assistant. It can't see or edit your Chronitical data yet. Fresh conversation each time you reload.</div>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Ask me anything…" onkeydown="if(event.key==='Enter') sendChat()">
      <div class="chat-input-actions">
        <button class="mic-btn" id="micChat" style="--mic-color:var(--c-assistant)" onclick="voiceChat()">🎙️</button>
        <button class="chat-send-btn" onclick="sendChat()">Send ➤</button>
      </div>
    </div>
    <div class="voice-status" id="voiceStatusChat"></div>
  </div>
</div>

<header class="top">
  <div class="brand-row">
    <span class="date" id="todayDate">—</span>
  </div>
  <h1 id="greeting">Today</h1>
</header>

<div style="display:flex; justify-content:flex-end; padding:0 20px;">
  <button class="btn-ghost" id="tabReorderToggle" onclick="toggleTabReorder()" style="font-size:12px;">⇄ Reorder sections</button>
</div>
<div class="tabstrip" id="tabstrip"></div>

<main id="sections"></main>

<script>
// Clickjacking mitigation: GitHub Pages serves static files with no way to set
// X-Frame-Options/frame-ancestors headers, so this is the only defense available —
// break out if this page is ever loaded inside someone else's iframe.
if(window.top !== window.self){
  window.top.location = window.self.location;
}
/* =========================================================================
   HOW TO ADD A NEW SECTION (ask me and I'll do this, or DIY):
   1. Add an entry to SECTIONS below: {id, label, color}
   2. Add a matching <section id="sec-<id>"> block inside buildSectionShells()
      — for a simple checklist, reuse the Culture/Places item pattern (add/toggle/delete/render)
      — for freeform entries, reuse the notes pattern
   3. Load its data: state.<name> = await sget('storage-key', default) in loadAll()
   The tab strip, styling, and nav wire up automatically from SECTIONS.
   ========================================================================= */

const SECTIONS = [
  {id:'today',  label:'Today',     color:'var(--c-today)'},
  {id:'todo',   label:'To-do',     color:'var(--c-todo)'},
  {id:'events', label:'Calendar',  color:'var(--c-events)'},
  {id:'dates',  label:'Birthdays', color:'var(--c-dates)'},
  {id:'cal',    label:'Health',    color:'var(--c-cal)'},
  {id:'culture',label:'Culture/Media',color:'var(--c-culture)'},
  {id:'places', label:'Location',  color:'var(--c-places)'},
  {id:'groceries',label:'Shopping',color:'var(--c-groceries)'},
  {id:'notes',  label:'Other',     color:'var(--c-notes)'},
  {id:'ideas',  label:'Ideas',     color:'var(--c-ideas)'},
];

function todayKey(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDateHeader(){
  const d = new Date();
  return d.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});
}
function greetingText(){
  const h = new Date().getHours();
  if(h<5) return 'Still up?';
  if(h<12) return 'Good morning';
  if(h<17) return 'Good afternoon';
  if(h<21) return 'Good evening';
  return 'Winding down';
}
const TODAY = todayKey();

/* ---------- storage: IndexedDB-backed, same interface as before (sget/sset) ---------- */
const DB_NAME = 'ledger-db';
const STORE_NAME = 'kv';
let _dbPromise = null;
function openDB(){
  if(_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(STORE_NAME); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return _dbPromise;
}
async function sget(key, fallback){
  try{
    const db = await openDB();
    return await new Promise((resolve)=>{
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get(key);
      req.onsuccess = ()=> resolve(req.result !== undefined ? JSON.parse(req.result) : fallback);
      req.onerror = ()=> resolve(fallback);
    });
  }catch(e){ return fallback; }
}
async function sset(key, value){
  try{
    const db = await openDB();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put(JSON.stringify(value), key);
      tx.oncomplete = resolve;
      tx.onerror = ()=> reject(tx.error);
    });
  }catch(e){ console.error('storage set failed', key, e); }
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

let state = {
  todos: [],
  calories: {}, calGoal: 2000, foodStandards: [],
  culture: [], places: [], groceries: [], notes: [], ideas: [], bdays: [],
  events: [], chatHistory: [], activities: {}, weights: {}
};

let tabOrder = SECTIONS.filter(s=>s.id!=='today').map(s=>s.id);
let tabReorderMode = false;
function orderedSections(){
  const bySec = Object.fromEntries(SECTIONS.map(s=>[s.id, s]));
  const rest = tabOrder.filter(id=>bySec[id] && id!=='today');
  SECTIONS.forEach(s=>{ if(s.id!=='today' && !rest.includes(s.id)) rest.push(s.id); });
  return [bySec['today'], ...rest.map(id=>bySec[id])];
}
function buildTabstrip(){
  const el = document.getElementById('tabstrip');
  const current = document.querySelector('.tabchip.active');
  const currentSec = current ? current.dataset.sec : 'today';
  el.innerHTML = orderedSections().map(s=>`
    <button class="tabchip ${s.id==='today'?'tabchip-main':''} ${s.id===currentSec?'active':''}" data-sec="${s.id}" style="--chip-color:${s.color}" onclick="handleTabClick('${s.id}')">
      <span class="dot" style="background:${s.color}"></span>${s.label}
    </button>`).join('');
}
function handleTabClick(sec){
  if(tabReorderMode) return;
  goTo(sec);
}
function toggleTabReorder(){
  tabReorderMode = !tabReorderMode;
  document.getElementById('tabstrip').classList.toggle('reorder-mode', tabReorderMode);
  const btn = document.getElementById('tabReorderToggle');
  btn.textContent = tabReorderMode ? '✓ Done reordering' : '⇄ Reorder sections';
  btn.classList.toggle('active', tabReorderMode);
}
let tabDragId = null;
function setupTabDrag(){
  const strip = document.getElementById('tabstrip');
  strip.addEventListener('pointerdown', e=>{
    if(!tabReorderMode) return;
    const chip = e.target.closest('.tabchip');
    if(!chip || chip.classList.contains('tabchip-main')) return;
    tabDragId = chip.dataset.sec;
    chip.classList.add('dragging');
    try{ chip.setPointerCapture(e.pointerId); }catch(err){}
  });
  strip.addEventListener('pointermove', e=>{
    if(!tabDragId) return;
    const dragging = strip.querySelector('.tabchip.dragging');
    if(!dragging) return;
    const siblings = Array.from(strip.querySelectorAll('.tabchip:not(.dragging):not(.tabchip-main)'));
    let closest = null, closestDist = Infinity;
    for(const el of siblings){
      const box = el.getBoundingClientRect();
      const cx = box.left + box.width/2;
      const cy = box.top + box.height/2;
      const dist = Math.hypot(e.clientX-cx, e.clientY-cy);
      if(dist < closestDist){ closestDist = dist; closest = el; }
    }
    if(closest) strip.insertBefore(dragging, closest);
    else strip.appendChild(dragging);
  });
  const endDrag = ()=>{
    if(!tabDragId) return;
    const dragging = strip.querySelector('.tabchip.dragging');
    if(dragging) dragging.classList.remove('dragging');
    tabOrder = Array.from(strip.querySelectorAll('.tabchip:not(.tabchip-main)')).map(el=>el.dataset.sec);
    sset('tabs:order', tabOrder);
    tabDragId = null;
  };
  strip.addEventListener('pointerup', endDrag);
  strip.addEventListener('pointercancel', endDrag);
}

function openAssistantModal(){

function getRecognition(interim){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return null;
  const r = new SR();
  r.lang = 'en-US';
  r.interimResults = !!interim;
  r.maxAlternatives = 1;
  return r;
}

/* ---------- Assistant chat — talks to a free Cloudflare Worker, not Claude directly ----------
   Fill these in once you've deployed the Worker (see the setup notes it came with). */
const WORKER_URL = 'https://chronitical-ai.michenet-kevin.workers.dev';
const CHRONITICAL_APP_TOKEN = 'x7Kp2mQ9vLwZ4rT8';

async function callAssistant(messages){
  if(!WORKER_URL || !CHRONITICAL_APP_TOKEN){
    throw new Error('NOT_CONFIGURED');
  }
  const response = await fetch(WORKER_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-App-Token': CHRONITICAL_APP_TOKEN,
    },
    body: JSON.stringify({ messages }),
  });
  if(!response.ok){
    if(response.status === 401){
      throw new Error('UNAUTHORIZED');
    }
    let detail = '';
    try{ const errBody = await response.json(); detail = errBody.detail || errBody.error || ''; }catch(e){}
    const err = new Error('REQUEST_FAILED');
    err.detail = detail;
    err.status = response.status;
    throw err;
  }
  const data = await response.json();
  return data.reply || '';
}
function renderChat(){
  const el = document.getElementById('chatLog');
  if(!el) return;
  el.innerHTML = state.chatHistory.map(m=>`
    <div class="chat-msg ${m.role}">${escapeHtml(m.content)}</div>`).join('');
  el.scrollTop = el.scrollHeight;
}
async function sendChat(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  input.value='';
  state.chatHistory.push({role:'user', content:text});
  renderChat();
  const status = document.getElementById('voiceStatusChat');
  status.textContent = 'Thinking…';
  try{
    const apiMessages = state.chatHistory.map(m=>({role:m.role, content:m.content}));
    const reply = await callAssistant(apiMessages);
    state.chatHistory.push({role:'assistant', content: reply || "Sorry, I didn't catch that."});
  }catch(e){
    let msg;
    if(e && e.message === 'NOT_CONFIGURED'){
      msg = "The assistant isn't set up yet — deploy the Cloudflare Worker and fill in WORKER_URL and CHRONITICAL_APP_TOKEN near the top of the script.";
    } else if(e && e.message === 'UNAUTHORIZED'){
      msg = "The app's token doesn't match what's in the Worker's Secret Store — double check CHRONITICAL_APP_TOKEN here matches the secret's value exactly.";
    } else if(e && e.message === 'REQUEST_FAILED'){
      msg = `The Worker returned an error (status ${e.status})${e.detail ? ': ' + e.detail : ''}.`;
    } else {
      msg = `Something went wrong reaching the assistant: ${e && e.message ? e.message : 'unknown error'}.`;
    }
    state.chatHistory.push({role:'assistant', content: msg});
  }
  status.textContent = '';
  sset('chat:history', state.chatHistory);
  renderChat();
}
function voiceChat(){
  const btn = document.getElementById('micChat');
  const status = document.getElementById('voiceStatusChat');
  const recognition = getRecognition(false);
  if(!recognition){ status.textContent = 'Voice input is not supported in this browser.'; return; }
  btn.classList.add('listening');
  status.textContent = 'Listening…';
  recognition.onresult = (e)=>{
    const transcript = e.results[0][0].transcript;
    document.getElementById('chatInput').value = transcript;
    status.textContent = '';
    btn.classList.remove('listening');
    sendChat();
  };
  recognition.onerror = ()=>{ status.textContent = "Didn't catch that — try again."; btn.classList.remove('listening'); };
  recognition.onend = ()=>{ btn.classList.remove('listening'); };
  recognition.start();
}

/* ---------- todos (unified list: optional due date, ASAP flag, manual drag order) ---------- */
let asapActive = false;
function toggleAsap(){
  asapActive = !asapActive;
  document.getElementById('asapToggle').classList.toggle('active', asapActive);
}
function addTodoItem(){
  const textEl = document.getElementById('todoInput');
  const dateEl = document.getElementById('todoDueDate');
  const text = textEl.value.trim();
  if(!text) return;
  const dueDate = asapActive ? null : (dateEl.value || null);
  const maxOrder = state.todos.reduce((m,t)=>Math.max(m, t.order||0), -1);
  state.todos.push({id:uid(), text, done:false, dueDate, asap:asapActive, order:maxOrder+1});
  sset('todos:all', state.todos);
  textEl.value=''; dateEl.value='';
  asapActive = false;
  document.getElementById('asapToggle').classList.remove('active');
  renderTodoList(); renderTodayTodos();
}
function toggleTodoItem(id){
  const t = state.todos.find(t=>t.id===id);
  if(t){ t.done = !t.done; sset('todos:all', state.todos); }
  renderTodoList(); renderTodayTodos();
}
function deleteTodoItem(id){
  state.todos = state.todos.filter(t=>t.id!==id);
  sset('todos:all', state.todos);
  renderTodoList(); renderTodayTodos();
}
function fmtDue(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString(undefined,{month:'short', day:'numeric'});
}
let editingTodoId = null;
function startEditTodo(id){ editingTodoId = id; renderTodoList(); }
function cancelEditTodo(){ editingTodoId = null; renderTodoList(); }
function saveEditTodo(id){
  const t = state.todos.find(t=>t.id===id);
  if(t){
    t.text = document.getElementById('editTodoText-'+id).value.trim();
    t.dueDate = document.getElementById('editTodoDate-'+id).value || null;
    t.asap = document.getElementById('editTodoAsap-'+id).checked;
    sset('todos:all', state.todos);
  }
  editingTodoId = null;
  renderTodoList(); renderTodayTodos();
}
function renderTodoList(){
  const el = document.getElementById('todoList');
  if(!el) return;
  // Manual order (set via drag) governs open tasks here; done tasks sink to the bottom, crossed out.
  const sorted = [...state.todos].sort((a,b)=>{
    if(a.done !== b.done) return a.done ? 1 : -1;
    return (a.order||0) - (b.order||0);
  });
  el.innerHTML = sorted.length ? sorted.map(t=>{
    if(editingTodoId === t.id){
      return `<div class="item" style="flex-direction:column; align-items:stretch; gap:8px;">
        <input type="text" id="editTodoText-${t.id}" value="${escapeHtml(t.text)}" placeholder="Task…">

          <input type="date" id="editTodoDate-${t.id}" value="${t.dueDate||''}" style="flex:1;">
          <label style="display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft); white-space:nowrap;">
            <input type="checkbox" id="editTodoAsap-${t.id}" style="width:auto;" ${t.asap?'checked':''}> ASAP
          </label>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn-ghost" onclick="saveEditTodo('${t.id}')">Save</button>
          <button class="btn-ghost" onclick="cancelEditTodo()">Cancel</button>
        </div>
      </div>`;
    }
    return `<div class="item ${t.done?'done':''}" data-id="${t.id}" style="--check-color:var(--c-todo)">

function renderTodayTodos(){
  // Home page: every open (not-done) task, ASAP first, then soonest due date, then no-date tasks.
  // Tick to complete — it then disappears from Home but stays visible (crossed out) in the To-do section.
  const list = [...state.todos].filter(t=>!t.done).sort((a,b)=>{
    if(a.asap !== b.asap) return a.asap ? -1 : 1;
    if(a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
    if(a.dueDate) return -1;
    if(b.dueDate) return 1;
    return (a.order||0) - (b.order||0);
  });
  const el = document.getElementById('dailyListToday');
  if(!el) return;

    <div class="row">

/* ---------- drag-to-reorder for the To-do section (pointer events; works on touch + mouse) ---------- */
let dragId = null;
function setupTodoDrag(){
  const list = document.getElementById('todoList');
  if(!list) return;
  list.addEventListener('pointerdown', e=>{
    const handle = e.target.closest('.drag-handle');
    if(!handle) return;
    const item = handle.closest('.item');
    dragId = item.dataset.id;
    item.classList.add('dragging');
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
  });
  list.addEventListener('pointermove', e=>{
    if(!dragId) return;
    const dragging = list.querySelector('.item.dragging');
    if(!dragging) return;
    const siblings = Array.from(list.querySelectorAll('.item:not(.dragging)'));
    const y = e.clientY;
    let after = null;
    for(const el of siblings){
      const box = el.getBoundingClientRect();
      if(y < box.top + box.height/2){ after = el; break; }
    }
    if(after) list.insertBefore(dragging, after);
    else list.appendChild(dragging);
  });
  const endDrag = ()=>{
    if(!dragId) return;
    const dragging = list.querySelector('.item.dragging');
    if(dragging) dragging.classList.remove('dragging');
    const ids = Array.from(list.querySelectorAll('.item[data-id]')).map(el=>el.dataset.id);
    ids.forEach((id, idx)=>{
      const t = state.todos.find(t=>t.id===id);
      if(t) t.order = idx;
    });
    sset('todos:all', state.todos);
    dragId = null;
    renderTodoList(); renderTodayTodos();
  };
  list.addEventListener('pointerup', endDrag);
  list.addEventListener('pointercancel', endDrag);
}

/* ---------- browsable calendar (search + month grid across any day/month/year) ---------- */
let eventsCalMonth = new Date();
let selectedCalDay = null;
function shiftEventsCalMonth(delta){
  eventsCalMonth.setMonth(eventsCalMonth.getMonth()+delta);
  selectedCalDay = null;
  renderEventsCal();
}
function showEventsForDay(key){
  selectedCalDay = (selectedCalDay===key) ? null : key;
  renderEventsCal();
}
function renderEventsCal(){
  const grid = document.getElementById('eventsCalGrid');
  const label = document.getElementById('eventsCalLabel');
  if(!grid) return;
  const y = eventsCalMonth.getFullYear(), m = eventsCalMonth.getMonth();
  if(label) label.textContent = eventsCalMonth.toLocaleDateString(undefined,{month:'long', year:'numeric'});
  const firstDay = (new Date(y,m,1).getDay() + 6) % 7; // Monday-first
  const daysInMonth = new Date(y,m+1,0).getDate();
  const byDay = {};
  state.events.forEach(e=>{ (byDay[e.date] = byDay[e.date]||[]).push(e); });
  state.bdays.forEach(b=>{ const k = bdayDateKey(b.date); if(new Date(k+'T00:00:00').getFullYear()===y || true){ (byDay[k] = byDay[k]||[]).push({title:b.name, time:null, isBday:true}); } });

  let cells = '';
  for(let i=0;i<firstDay;i++) cells += '<div class="hist-cell empty-cell"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const key = dateKeyFor(y,m,d);
    const items = byDay[key]||[];
    const isToday = key===TODAY;
    const isSelected = key===selectedCalDay;
    cells += `<div class="hist-cell ${isToday?'hist-today':''} ${items.length?'hist-has':''} ${isSelected?'hist-selected':''}" onclick="showEventsForDay('${key}')">
      <div class="hist-top-row">
        <span class="hist-icon-left"></span>
        <span class="hist-day">${d}</span>
        <span class="hist-icon-right"></span>
      </div>
      <div class="hist-kcal">${items.length ? (items.length===1?'•':items.length) : ''}</div>
    </div>`;
  }
  grid.innerHTML = cells;

  const detailEl = document.getElementById('eventsCalDayDetail');
  if(detailEl){
    if(!selectedCalDay){ detailEl.innerHTML = ''; }
    else{
      const items = byDay[selectedCalDay]||[];
      const d = new Date(selectedCalDay+'T00:00:00');
      const dateLabel = d.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});
      detailEl.innerHTML = `<div style="font-weight:600; font-size:13px; margin-bottom:8px;">${dateLabel}</div>` + (items.length ? items.map(it=>`
        <div class="row">
          <div class="badge" style="background:${it.isBday?'var(--c-dates)':'var(--c-events)'}">${it.isBday?'🎂':'📅'}</div>
          <div class="row-info"><b>${escapeHtml(it.title)}</b>${it.time ? `<span>${it.time}</span>` : ''}</div>
        </div>`).join('') : '<div class="empty">Nothing that day.</div>');
    }
  }
}
/* ---------- Google Calendar sharing ---------- */
function googleCalLink(e){
  const dateStr = e.date.replace(/-/g,'');
  let datesParam;
  if(e.time){
    const startHM = e.time.replace(':','');
    const endHM = (e.endTime || e.time).replace(':','');
    datesParam = `${dateStr}T${startHM}00/${dateStr}T${endHM}00`;
  } else {
    const d = new Date(e.date+'T00:00:00');
    const next = new Date(d); next.setDate(next.getDate()+1);
    const nextStr = dateKeyFor(next.getFullYear(), next.getMonth(), next.getDate()).replace(/-/g,'');
    datesParam = `${dateStr}/${nextStr}`;
  }
  const params = new URLSearchParams({ action:'TEMPLATE', text:e.title, dates:datesParam });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}
function searchEvents(){
  const q = document.getElementById('eventSearchInput').value.trim().toLowerCase();
  const el = document.getElementById('eventSearchResults');
  if(!q){ el.innerHTML = ''; return; }
  const matches = state.events
    .filter(e=>e.title.toLowerCase().includes(q))
    .sort((a,b)=> a.date.localeCompare(b.date));
  el.innerHTML = matches.length ? matches.map(e=>{
    const d = new Date(e.date+'T00:00:00');
    const dateLabel = d.toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'});
    const tm = fmtEventTime(e);
    return `<div class="row">
      <div class="badge" style="background:var(--c-events)">📅</div>
      <div class="row-info"><b>${escapeHtml(e.title)}</b><span>${dateLabel}${tm ? ' · '+tm : ''}</span></div>
    </div>`;
  }).join('') : '<div class="empty">No matching events.</div>';
}

          <button class="btn-ghost" onclick="cancelEditCalorie()">Cancel</button>

    }
    return `<div class="log-item">
      <span>${escapeHtml(e.name)}${e.qty ? ` <span class="meta">· ${fmtQty(e)}</span>` : ''}</span>
      <span><span class="amt">${e.kcal}</span> <button class="btn-ghost" onclick="startEditCalorie('${e.id}')">Edit</button> <button class="btn-ghost" onclick="deleteCalorie('${e.id}')">×</button></span>
    </div>`;
  }).join('') : '<div class="empty">No entries yet today.</div>';
  const goalEl = document.getElementById('calGoal');
  if(goalEl) goalEl.value = state.calGoal;

  // Home page ring — was previously never wired up, so it always showed 0
  const goal = state.calGoal || 2000;
  const ringEl = document.getElementById('ringCal');
  const ringTextEl = document.getElementById('ringCalText');
  const ringGoalEl = document.getElementById('ringCalGoal');
  if(ringEl){
    const circumference = 2*Math.PI*46;
    const frac = Math.max(0, Math.min(total/goal, 1));
    ringEl.style.strokeDasharray = `${circumference}`;
    ringEl.style.strokeDashoffset = `${circumference*(1-frac)}`;
  }
  if(ringTextEl) ringTextEl.textContent = total;
  if(ringGoalEl) ringGoalEl.textContent = goal;
}

let healthTrendsRangeDays = 30;
function setHealthTrendsRange(val){
  healthTrendsRangeDays = val; // either a number of days, or the string 'ytd'
  renderHealthTrends();
}
function renderHealthTrends(){
  const el = document.getElementById('healthTrendsChart');
  if(!el) return;

  const today0 = new Date(); today0.setHours(0,0,0,0);
  let rangeStart;
  if(healthTrendsRangeDays === 'ytd'){
    rangeStart = new Date(today0.getFullYear(), 0, 1);
  } else {
    const N = parseInt(healthTrendsRangeDays);
    rangeStart = new Date(today0); rangeStart.setDate(rangeStart.getDate()-(N-1));
  }
  const rangeSpanDays = Math.round((today0-rangeStart)/(1000*60*60*24)) + 1;

  // build the full range first, so we can find where actual data begins within it
  const fullRange = [];
  for(let i=0; i<rangeSpanDays; i++){
    const d = new Date(rangeStart); d.setDate(d.getDate()+i);
    const key = dateKeyFor(d.getFullYear(), d.getMonth(), d.getDate());
    const kcal = (state.calories[key]||[]).reduce((s,e)=>s+e.kcal,0);
    const w = state.weights[key];
    const act = state.activities[key];
    fullRange.push({ key, date:d, kcal, weight: w ? w.value : null, gym: !!(act&&act.gym), run: !!(act&&act.run) });
  }
  const firstDataIdx = fullRange.findIndex(d=> d.kcal || d.weight!=null || d.gym || d.run);
  // trim any leading days with nothing logged, so the chart fills from the left instead of starting blank
  const days = firstDataIdx === -1 ? [] : fullRange.slice(firstDataIdx);
  const N = days.length;
  // days[0] is the first day with data, days[days.length-1] is today — chart reads left (earliest) to right (today)

  const W = 320, H = 168;
  const padL = 8, padR = 8, padT = 8;
  const plotW = W - padL - padR;
  if(N === 0){
    el.innerHTML = '<div class="empty">Not enough logged yet to show a trend.</div>';
    return;
  }
  const barAreaTop = padT, barAreaBottom = 96;
  const gymY = 110, runY = 122;
  const labelY = 138;
  const rangeLabelY = 158;
  const colW = plotW / N;
  const barW = Math.max(1, colW*0.6);

  const maxKcal = Math.max(...days.map(d=>d.kcal), 2400, 1);
  const kcalScale = v => barAreaBottom - (v/maxKcal) * (barAreaBottom-barAreaTop);

  const weighted = days.filter(d=>d.weight!=null);
  let minW = 0, maxW = 1;
  if(weighted.length){
    minW = Math.min(...weighted.map(d=>d.weight));
    maxW = Math.max(...weighted.map(d=>d.weight));
    if(minW===maxW){ minW -= 1; maxW += 1; }
    else { const pad=(maxW-minW)*0.15; minW-=pad; maxW+=pad; }
  }
  const weightScale = v => barAreaBottom - ((v-minW)/(maxW-minW)) * (barAreaBottom-barAreaTop);

  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;">`;
  svg += `<line x1="${padL}" y1="${barAreaBottom}" x2="${W-padR}" y2="${barAreaBottom}" stroke="var(--line)" stroke-width="1"/>`;

  // dotted reference lines so you can tell at a glance which days were over/under
  [2000, 2400].forEach(v=>{
    const y = kcalScale(v);
    svg += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--ink-faint)" stroke-width="1" stroke-dasharray="2,3"/>`;
    svg += `<text x="${W-padR}" y="${(y-2).toFixed(1)}" font-size="6.5" fill="var(--ink-faint)" text-anchor="end">${v}</text>`;
  });

  // calorie bars
  days.forEach((d,i)=>{
    if(!d.kcal) return;
    const x = padL + i*colW + (colW-barW)/2;
    const y = kcalScale(d.kcal);
    svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${(barAreaBottom-y).toFixed(1)}" fill="var(--c-cal)" opacity="0.35" rx="1.5"/>`;
  });

  // weight line + points
  if(weighted.length){
    const pts = weighted.map(d=>{
      const i = days.indexOf(d);
      const x = padL + i*colW + colW/2;
      const y = weightScale(d.weight);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    if(pts.length>1){
      svg += `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--ink)" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    weighted.forEach(d=>{
      const i = days.indexOf(d);
      const x = padL + i*colW + colW/2;
      const y = weightScale(d.weight);
      svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2" fill="var(--ink)"/>`;
    });
  }

  // gym and run each get their own fixed row, so a day with both still lines up correctly under its column
  days.forEach((d,i)=>{
    const x = padL + i*colW + colW/2;
    if(d.gym) svg += `<text x="${x.toFixed(1)}" y="${gymY}" font-size="7" text-anchor="middle">💪</text>`;
    if(d.run) svg += `<text x="${x.toFixed(1)}" y="${runY}" font-size="7" text-anchor="middle">🏃</text>`;
  });

  // sparse date labels, spaced out based on how many days are shown
  const labelEvery = Math.max(1, Math.ceil(N/6));
  days.forEach((d,i)=>{
    if(i % labelEvery !== 0 && i !== N-1) return;
    const x = padL + i*colW + colW/2;
    const label = d.date.toLocaleDateString(undefined,{month:'numeric', day:'numeric'});
    svg += `<text x="${x.toFixed(1)}" y="${labelY}" font-size="7" fill="var(--ink-soft)" text-anchor="middle">${label}</text>`;
  });

  // explicit reading-direction labels, so it's unambiguous which end is which
  const firstLabel = days[0].date.toLocaleDateString(undefined,{month:'short', day:'numeric'});
  svg += `<text x="${padL}" y="${rangeLabelY}" font-size="7.5" fill="var(--ink-faint)" text-anchor="start">${firstLabel}</text>`;
  svg += `<text x="${W-padR}" y="${rangeLabelY}" font-size="7.5" fill="var(--ink-faint)" text-anchor="end">Today →</text>`;

  svg += `</svg>`;

  el.innerHTML = svg;
}

/* ---------- drag between Want to go / Been there (pointer events; works on touch + mouse) ---------- */
let placeDragId = null;
function pointIsInside(el, x, y){
  if(!el) return false;
  const box = el.getBoundingClientRect();
  return x>=box.left && x<=box.right && y>=box.top && y<=box.bottom;
}
function setupPlacesDrag(){
  document.addEventListener('pointerdown', e=>{
    const handle = e.target.closest('.place-drag-handle');
    if(!handle) return;
    const item = handle.closest('.item');
    placeDragId = item.dataset.id;
    item.classList.add('dragging');
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
  });
  document.addEventListener('pointermove', e=>{
    if(!placeDragId) return;
    const dragging = document.querySelector(`.item.dragging[data-id="${placeDragId}"]`);
    if(!dragging) return;
    const wantEl = document.getElementById('placesWantList');
    const beenEl = document.getElementById('placesBeenList');
    if(pointIsInside(beenEl, e.clientX, e.clientY) && dragging.parentElement !== beenEl){
      beenEl.appendChild(dragging);
    } else if(pointIsInside(wantEl, e.clientX, e.clientY) && dragging.parentElement !== wantEl){
      wantEl.appendChild(dragging);
    }
  });
  const endDrag = ()=>{
    if(!placeDragId) return;
    const dragging = document.querySelector(`.item.dragging[data-id="${placeDragId}"]`);
    if(dragging){
      dragging.classList.remove('dragging');
      const nowBeen = dragging.parentElement && dragging.parentElement.id === 'placesBeenList';
      const t = state.places.find(p=>p.id===placeDragId);
      if(t){ t.done = nowBeen; if(!nowBeen) t.rating = null; sset('places:list', state.places); }
    }
    placeDragId = null;
    renderPlaces();
  };
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
}

        <input type="text" id="editTitle-${n.id}" value="${escapeHtml(n.title)}" placeholder="Title (optional)" style="margin-bottom:8px;">
        <textarea id="editBody-${n.id}" placeholder="Write something…">${escapeHtml(n.body)}</textarea>
        <div class="note-actions">
          <button class="btn-ghost" onclick="saveEditNote('${n.id}')">Save</button>
          <button class="btn-ghost" onclick="cancelEditNote()">Cancel</button>
        </div>
      </div>`;
    }
    return `<div class="note-card">
      ${n.title ? `<div class="note-title">${escapeHtml(n.title)}</div>` : ''}
      ${n.body ? `<div class="note-body">${escapeHtml(n.body)}</div>` : ''}
      <div class="note-actions">
        <button class="btn-ghost" onclick="startEditNote('${n.id}')">Edit</button>
        <button class="btn-ghost" onclick="deleteNote('${n.id}')">Delete</button>
      </div>
    </div>`;
  }).join('') : '<div class="empty">No notes yet.</div>';
}

/* ---------- Home: merged upcoming (events, including recurring yearly ones like birthdays) ---------- */
/* ---------- birthdays (always yearly by nature — separate from Calendar events) ---------- */
function nextBdayOccurrence(dateStr){
  const now = new Date(); now.setHours(0,0,0,0);
  const d = new Date(dateStr+'T00:00:00');
  let next = new Date(now.getFullYear(), d.getMonth(), d.getDate());
  if(next < now) next = new Date(now.getFullYear()+1, d.getMonth(), d.getDate());
  return next;
}
function daysUntil(dateStr){
  const now = new Date(); now.setHours(0,0,0,0);
  const next = nextBdayOccurrence(dateStr);
  return Math.round((next-now)/(1000*60*60*24));
}
function bdayDateKey(dateStr){
  const d = nextBdayOccurrence(dateStr);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addBday(){
  const nameEl = document.getElementById('bdayName');
  const dateEl = document.getElementById('bdayDate');
  const name = nameEl.value.trim();
  const date = dateEl.value;
  if(!name || !date) return;
  state.bdays.push({id:uid(), name, date});
  sset('bdays:list', state.bdays);
  nameEl.value=''; dateEl.value='';
  renderBdays();
}
function deleteBday(id){
  state.bdays = state.bdays.filter(b=>b.id!==id);
  sset('bdays:list', state.bdays);
  renderBdays();
}
let editingBdayId = null;
function startEditBday(id){ editingBdayId = id; renderBdays(); }
function cancelEditBday(){ editingBdayId = null; renderBdays(); }
function saveEditBday(id){
  const b = state.bdays.find(b=>b.id===id);
  if(b){
    b.name = document.getElementById('editBdayName-'+id).value.trim();
    b.date = document.getElementById('editBdayDate-'+id).value;
    sset('bdays:list', state.bdays);
  }
  editingBdayId = null;
  renderBdays();
}
function renderBdays(){
  const sorted = [...state.bdays].sort((a,b)=>daysUntil(a.date)-daysUntil(b.date));

  const fullEl = document.getElementById('bdayListFull');
  if(fullEl) fullEl.innerHTML = sorted.length ? sorted.map(b=>{
    if(editingBdayId === b.id){
      return `<div class="item" style="flex-direction:column; align-items:stretch; gap:8px;">
        <input type="text" id="editBdayName-${b.id}" value="${escapeHtml(b.name)}" placeholder="Name">
        <input type="date" id="editBdayDate-${b.id}" value="${b.date}">
        <div style="display:flex; gap:8px;">
          <button class="btn-ghost" onclick="saveEditBday('${b.id}')">Save</button>
          <button class="btn-ghost" onclick="cancelEditBday()">Cancel</button>
        </div>
      </div>`;
    }
    const d = new Date(b.date+'T00:00:00');
    const md = d.toLocaleDateString(undefined,{month:'long', day:'numeric'});
    return `<div class="row">
      <div class="badge" style="background:var(--c-dates)">🎂</div>
      <div class="row-info"><b>${escapeHtml(b.name)}</b><span>${md}</span></div>
      <button class="btn-ghost" onclick="startEditBday('${b.id}')">Edit</button>
      <button class="btn-ghost" onclick="deleteBday('${b.id}')">×</button>
    </div>`;
  }).join('') : '<div class="empty">No birthdays saved yet.</div>';

  // birthdays now surface on Home via Today's events (if today) and Upcoming (next 30 days)
  renderEvents();
}

function renderUpcomingHome(){
  const el = document.getElementById('upcomingList');
  if(!el) return;
  const now = new Date(); now.setHours(0,0,0,0);
  const eventsWindowEnd = new Date(now); eventsWindowEnd.setDate(eventsWindowEnd.getDate()+14);

  // today's items already appear in the "Today's events" card, so only show future ones here
  const eventItems = state.events
    .filter(e=>{ const d = new Date(e.date+'T00:00:00'); return d>now && d<=eventsWindowEnd; })
    .map(e=>({ type:'event', date:e.date, title:e.title, time:e.time, endTime:e.endTime }));

  const bdayItems = state.bdays
    .filter(b=>{ const dn = daysUntil(b.date); return dn>0 && dn<=30; })
    .map(b=>({ type:'birthday', date:bdayDateKey(b.date), title:b.name }));

  const items = [...eventItems, ...bdayItems].sort((a,b)=> (a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));

  if(!items.length){ el.innerHTML = '<div class="empty">Nothing coming up in the next 30 days.</div>'; return; }
  el.innerHTML = items.map(item=>{
    const d = new Date(item.date+'T00:00:00');
    const md = d.toLocaleDateString(undefined,{month:'short', day:'numeric'});
    const label = item.date===TODAY ? 'Today' : md;
    if(item.type==='birthday'){
      return `<div class="row">
        <div class="badge" style="background:var(--c-dates)">🎂</div>
        <div class="row-info"><b>${escapeHtml(item.title)}</b><span>${label} · Birthday</span></div>
      </div>`;
    }
    const tm = fmtEventTime(item);
    return `<div class="row">
      <div class="badge" style="background:var(--c-events)">📅</div>
      <div class="row-info"><b>${escapeHtml(item.title)}</b><span>${label}${tm ? ' · '+tm : ''}</span></div>
    </div>`;
  }).join('');
}

/* ---------- init ---------- */
async function loadAll(){
  const migrated = await sget('todos:all', null);
  if(migrated === null){
    // one-time migration from the old overall/daily split into a single due-date list
    const oldOverall = await sget('todos:overall', []);
    const oldDaily = await sget('todos:daily', {});
    let merged = oldOverall.map(t=>({id:t.id, text:t.text, done:t.done, dueDate:null}));
    Object.keys(oldDaily).forEach(dateKey=>{
      (oldDaily[dateKey]||[]).forEach(t=>{
        merged.push({id:t.id, text:t.text, done:t.done, dueDate:dateKey});
      });
    });
    state.todos = merged;
  } else {
    state.todos = migrated;
  }
  // backfill order/asap for any todos saved before those fields existed
  let needsResave = migrated === null;
  state.todos.forEach((t, idx)=>{
    if(t.order === undefined){ t.order = idx; needsResave = true; }
    if(t.asap === undefined){ t.asap = false; needsResave = true; }
  });
  if(needsResave) await sset('todos:all', state.todos);

  state.calories      = await sget('cal:log', {});
  state.calGoal        = await sget('cal:goal', 2000);
  state.foodStandards   = await sget('food:standards', []);

  const migratedCulture = await sget('culture:list', null);
  if(migratedCulture === null){
    // one-time migration: old watchlist -> "movie" (re-tag any Series manually), old books -> "book"
    const oldWatch = await sget('list:watch', []);
    const oldBooks = await sget('list:books', []);
    const mergedCulture = [
      ...oldWatch.map(t=>({id:t.id, title:t.title, type:'movie', done:t.done})),
      ...oldBooks.map(t=>({id:t.id, title:t.title, type:'book', done:t.done})),
    ];
    state.culture = mergedCulture;
    await sset('culture:list', mergedCulture);
  } else {
    state.culture = migratedCulture;
  }
  state.places               = await sget('places:list', []);
  state.groceries          = await sget('groceries:list', []);
  state.notes               = await sget('notes:list', []);
  state.events                  = await sget('events:list', []);

  const bdaysSplit = await sget('migrated:events_bdays_split', false);
  if(!bdaysSplit){
    // undo the earlier merge: pull any birthday-tagged events back into their own list
    const bdayEvents = state.events.filter(e=>e.category==='birthday');
    const existingBdays = await sget('bdays:list', []);
    const pulledBdays = bdayEvents.map(e=>({id:e.id, name:e.title, date:e.date}));
    state.bdays = [...existingBdays, ...pulledBdays];
    state.events = state.events.filter(e=>e.category!=='birthday');
    await sset('bdays:list', state.bdays);
    await sset('events:list', state.events);
    await sset('migrated:events_bdays_split', true);
  } else {
    state.bdays = await sget('bdays:list', []);
  }
  state.ideas = await sget('ideas:list', []);

  const storedTabOrder = await sget('tabs:order', null);
  if(storedTabOrder){ tabOrder = storedTabOrder; buildTabstrip(); }

  state.chatHistory = await sget('chat:history', []);
  state.activities = await sget('activities:log', {});
  state.weights = await sget('weights:log', {});
  renderAll();
}
function renderAll(){
  document.getElementById('todayDate').textContent = fmtDateHeader();
  document.getElementById('greeting').textContent = greetingText();
  renderTodayTodos();
  renderTodoList();
  renderCalories();
  renderFoodStandards();
  renderWeightToday();
  renderCalHistory();
  renderCulture();
  renderPlaces();
  renderGroceries();
  renderNotes();
  renderIdeas();
  renderEvents();
  renderBdays();
  renderChat();
}

buildTabstrip();
buildSectionShells();
setupTodoDrag();
setupPlacesDrag();
setupTabDrag();
loadAll();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(err=>console.error('SW registration failed', err));
  });
}
